<title>Drum Chart Editor 2.0</title>

<style>
/* Layout: library of songs (setlist cards) → song view with chart left, bar editor + kit right,
   transport fixed at the bottom; stage mode is a full-screen chart. Rehearsal-room palette:
   coated drumhead paper, ink, cymbal brass for action, tally red for "live". */
:root{
  --bg:#eceef1; --paper:#fbfbfc; --raised:#ffffff; --sunk:#f2f3f6; --ink:#16181d; --ink2:#3a3f4a; --mut:#666d7a;
  --line:#d6dae1; --line2:#e7e9ee; --brass:#b9781a; --brass-ink:#8a5508; --brass-soft:#f6e6c8; --brass-glow:rgba(214,150,40,.45);
  --red:#d9363e; --red-soft:#fbe3e4; --ok:#1f8a5b; --focus:#2f6fd6;
  --shadow:0 1px 2px rgba(20,24,32,.06),0 4px 14px rgba(20,24,32,.06);
  --shadow-lg:0 10px 40px rgba(20,24,32,.18);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px; --tbar:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101216; --paper:#171a20; --raised:#1d2129; --sunk:#14171c; --ink:#eceef2; --ink2:#c5cad3; --mut:#949bab;
  --line:#2c313b; --line2:#232730; --brass:#efae45; --brass-ink:#f3bd63; --brass-soft:#3a2c14; --brass-glow:rgba(239,174,69,.5);
  --red:#ff5d63; --red-soft:#3b1c1e; --ok:#46c58c; --focus:#6ea2ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); --shadow-lg:0 14px 50px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101216; --paper:#171a20; --raised:#1d2129; --sunk:#14171c; --ink:#eceef2; --ink2:#c5cad3; --mut:#949bab;
  --line:#2c313b; --line2:#232730; --brass:#efae45; --brass-ink:#f3bd63; --brass-soft:#3a2c14; --brass-glow:rgba(239,174,69,.5);
  --red:#ff5d63; --red-soft:#3b1c1e; --ok:#46c58c; --focus:#6ea2ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); --shadow-lg:0 14px 50px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tbar) + 24px)}
body.lib{padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
h1,h2,h3{margin:0;text-wrap:balance}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:var(--r-sm);padding:7px 12px;font-weight:700;font-size:14px;line-height:1.2;color:var(--ink2);transition:background .12s,border-color .12s,transform .06s}
.btn:hover{border-color:var(--mut);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.pri{background:var(--brass);border-color:var(--brass);color:#1a1205}
.btn.pri:hover{filter:brightness(1.06);color:#1a1205}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk);border-color:var(--line2)}
.btn.on{background:var(--brass-soft);border-color:var(--brass);color:var(--brass-ink)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunk);padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink2)}
button.chip:hover{border-color:var(--brass)}
.chip.on{background:var(--brass-soft);border-color:var(--brass);color:var(--brass-ink)}
.field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);font-weight:700}
.field input[type=number],.field input[type=text],input.txt{border:1px solid var(--line);background:var(--raised);border-radius:var(--r-sm);padding:6px 8px;min-width:0;color:var(--ink)}
.field input[type=number]{width:74px;font-family:var(--f-mono)}
select{border:1px solid var(--line);background:var(--raised);border-radius:var(--r-sm);padding:6px 8px;color:var(--ink)}
input[type=range]{accent-color:var(--brass)}
input[type=checkbox]{accent-color:var(--brass);width:16px;height:16px}

/* ---- header ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line2)}
.top-in{max-width:1380px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1;background:none;border:0;padding:0;color:var(--ink)}
.mark .v{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:0;background:var(--brass);color:#1a1205;border-radius:4px;padding:2px 5px;transform:translateY(-3px) rotate(-4deg)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 220px}
.song-title{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.05;letter-spacing:.01em;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;min-width:0;width:100%;max-width:520px;color:var(--ink);text-overflow:ellipsis}
.song-title:hover{border-color:var(--line)}
.song-title:focus{border-color:var(--brass);background:var(--raised);outline:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;z-index:50}
.menu-pop button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;background:transparent;padding:9px 10px;border-radius:6px;font-weight:700;color:var(--ink2)}
.menu-pop button:hover{background:var(--sunk);color:var(--ink)}
.menu-pop small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.menu-pop hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}

main{max-width:1380px;margin:0 auto}

/* ---- library ---- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding:34px 0 26px}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,7vw,84px);line-height:.9;text-transform:uppercase;letter-spacing:.005em}
.hero h1 em{font-style:normal;color:var(--brass)}
.hero p{max-width:46ch;color:var(--ink2);font-size:17px;margin:16px 0 18px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.head-wrap{display:flex;justify-content:center}
.drumhead{position:relative;width:min(380px,82vw);aspect-ratio:1;max-width:100%;border:0;background:none;padding:0;border-radius:50%;color:var(--ink)}
.drumhead svg{width:100%;height:100%;display:block;overflow:visible}
.drumhead .skin{fill:var(--paper);stroke:var(--line);stroke-width:1}
.drumhead .rim{fill:none;stroke:var(--ink2);stroke-width:7}
.drumhead .rim2{fill:none;stroke:var(--mut);stroke-width:1.5;opacity:.6}
.drumhead .lug{fill:var(--ink2)}
.drumhead .txt1{font-family:var(--f-display);font-weight:800;font-size:31px;text-transform:uppercase;fill:var(--ink);letter-spacing:.02em}
.drumhead .txt2{font-family:var(--f-ui);font-size:13px;fill:var(--mut)}
.drumhead .ring{fill:none;stroke:var(--brass);stroke-width:2.5;opacity:0}
.drumhead:hover .skin,.drumhead.over .skin{fill:var(--brass-soft)}
.drumhead.over svg{animation:thrum .16s linear infinite}
.drumhead:active svg,.drumhead.hit svg{animation:boom .35s ease-out}
.drumhead.hit .ring{animation:ripple .7s ease-out}
@keyframes thrum{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@keyframes boom{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes ripple{0%{opacity:.9;r:80}100%{opacity:0;r:150}}
.lib-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:14px 0 12px;flex-wrap:wrap}
.lib-head h2{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--brass)}
.card.menu-open{z-index:20;transform:none}
.card .open{position:absolute;inset:0;border:0;background:transparent;border-radius:var(--r);z-index:1}
.card h3{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:34px}
.card .meta{font-family:var(--f-mono);font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.card .groove{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r-sm);padding:4px 6px;overflow:hidden}
.card .groove svg{width:100%;height:auto;display:block}
.card .secs{display:flex;gap:4px;flex-wrap:wrap;min-height:22px}
.card .secs span{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--ink2);border:1px solid var(--line2)}
.card .more{position:absolute;top:8px;right:8px;z-index:2}
.card .more>button{border:0;background:transparent;border-radius:6px;padding:4px 6px;color:var(--mut)}
.card .more>button:hover{background:var(--sunk);color:var(--ink)}
.card .rec{display:inline-flex;align-items:center;gap:4px;color:var(--red);font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--mut)}

/* ---- song view ---- */
.song{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:18px;padding-top:14px;align-items:start}
.chart-wrap{min-width:0}
.sec{margin:0 0 18px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;border-bottom:1.5px solid var(--ink);padding-bottom:4px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.sec-h .rng{font-family:var(--f-mono);font-size:12px;color:var(--mut)}
.sec-h .loop{margin-left:auto}
.rows{display:flex;flex-wrap:wrap;gap:10px 8px}
.brk{flex-basis:100%;height:0}
.unit{display:flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px;position:relative}
.unit.rep{border:2px solid var(--brass);padding-top:22px}
.unit .lab{position:absolute;left:8px;top:3px;font-size:12px;font-weight:700;color:var(--brass-ink);font-family:var(--f-mono)}
.bar{position:relative;border-radius:6px;padding:2px 2px 1px;border:1.5px solid transparent;background:none;text-align:left;color:inherit;line-height:0}
.bar:hover{background:var(--sunk)}
.bar.sel{border-color:var(--focus);background:color-mix(in srgb,var(--focus) 7%,transparent)}
.bar.now{background:color-mix(in srgb,var(--brass) 14%,transparent)}
.ts-tag{position:absolute;right:6px;top:-6px;border:1px solid currentColor;background:var(--panel,#fff);padding:0 2px;border-radius:3px;font-style:normal;font-family:var(--f-mono);font-size:9px;font-weight:700;color:var(--focus);line-height:1}
.grid .n.sp{border:1px dashed var(--focus);background:color-mix(in srgb,var(--focus) 8%,transparent);border-radius:4px;color:var(--focus);font:700 10px var(--f-mono);padding:2px 0;cursor:pointer}
.grid .n.sp:hover{background:var(--focus);color:var(--paper)}
.grid.splitting .c{opacity:.55}
.bar-len b{min-width:34px}
.split-hint{flex-basis:100%;margin:2px 0 0;font-size:12px}
.solo-tag{position:absolute;right:4px;top:1px;font-style:normal;font-family:var(--f-mono);font-size:9px;font-weight:700;color:var(--brass-ink);line-height:1}
.sec-h .sn-btn{margin-left:auto}.sec-h .sn-btn+.flow{margin-left:0}
.sec-h .flow{margin-left:auto}.sec-h .flow+.loop{margin-left:0}
.sec-note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.45;color:var(--ink2);margin:-2px 0 10px;padding:6px 10px;border-left:3px solid var(--brass);background:var(--brass-soft);border-radius:0 6px 6px 0;font-style:italic}
.sec-note[data-sn-edit]{cursor:text}.sec-note[data-sn-edit]:hover{outline:1px dashed var(--brass);outline-offset:-1px}
@media (max-width:560px){.sec-h .sn-btn .sn-t{display:none}}
.sec-note.editing{font-style:normal;background:none;border-left-color:var(--focus);padding:0 0 0 10px}
.sec-note textarea{width:100%;box-sizing:border-box;resize:vertical;font:inherit;font-size:15px;line-height:1.45;min-height:3.2em;padding:6px 8px}
.sec-note-act{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}.sec-note-act .mut{font-size:12px}
#stBody .sec-note{font-size:calc(var(--sz,1.6) * 11px)}
.sec-h .flow.on{color:var(--brass-ink)}
.bar i{position:absolute;left:4px;top:1px;font-style:normal;font-family:var(--f-mono);font-size:9px;color:var(--mut);line-height:1}
.bar svg{display:block}
.bar svg+svg{margin-top:4px;border-top:1px dashed var(--line);padding-top:2px}
.ph{fill:var(--brass);fill-opacity:.32}

.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 76px - var(--tbar) - 20px);overflow:auto;padding-bottom:4px}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.ed-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ed-top b{font-family:var(--f-display);font-size:24px;font-weight:800;text-transform:uppercase;line-height:1}
.ed-top .sub{font-size:12px;color:var(--mut);font-weight:700}
.ed-top .nav{margin-left:auto;display:flex;gap:4px}
.grid{display:grid;grid-template-columns:62px repeat(var(--cols,16),minmax(0,1fr));gap:2px;user-select:none;-webkit-user-select:none;touch-action:none}
.grid .n{font-family:var(--f-mono);font-size:10px;color:var(--mut);text-align:center;padding-bottom:2px}
.grid .n.b{color:var(--ink);font-weight:700}
.grid .rl{font-size:11px;font-weight:700;color:var(--ink2);border:0;background:transparent;text-align:left;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px}
.grid .rl:hover{color:var(--brass-ink);background:var(--sunk)}
.grid .c{height:22px;border:0;border-radius:3px;background:var(--sunk);padding:0}
.grid .c.q{margin-left:3px}
.grid .c:hover{background:var(--line)}
.grid .c.on{background:var(--ink)}
.grid .c.on.cym{background:var(--brass)}
.grid .c.fl{background:repeating-linear-gradient(135deg,var(--brass-soft) 0 4px,transparent 4px 8px)}
.grid .c.pl{box-shadow:inset 0 0 0 2px var(--red)}
.ed-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ed-row .lbl{font-size:12px;color:var(--mut);font-weight:700;margin-right:2px}
details.more-tools summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:6px}
details.more-tools summary::-webkit-details-marker{display:none}
details.more-tools summary::before{content:"▸";transition:transform .15s}
details.more-tools[open] summary::before{transform:rotate(90deg)}
.kit{display:block;width:100%;height:auto}
.kit .pc{cursor:pointer}
.kit .drum{fill:var(--paper);stroke:var(--ink2);stroke-width:2.5}
.kit .drum-in{fill:none;stroke:var(--line);stroke-width:1}
.kit .cym{fill:color-mix(in srgb,var(--brass) 30%,var(--paper));stroke:var(--brass);stroke-width:1.5}
.kit .cym-in{fill:none;stroke:var(--brass);stroke-width:.8;opacity:.6}
.kit .bell{fill:var(--brass)}
.kit text{font-family:var(--f-ui);font-size:10.5px;dominant-baseline:middle;font-weight:700;fill:var(--ink2);text-anchor:middle;pointer-events:none}
.kit{max-width:300px;margin:0 auto}.kit .pc[data-kit=pedal] text{fill:var(--mut);text-anchor:start}
.kit .pc .glow{fill:var(--brass-glow);opacity:0}
.kit .pc.hit .glow{animation:glow .32s ease-out}
.kit .pc.hit .shape{animation:bump .22s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes glow{0%{opacity:1}100%{opacity:0}}
@keyframes bump{0%{transform:scale(1.08)}100%{transform:scale(1)}}

.key{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:12px;margin:0 0 12px;color:var(--ink2)}
.key b{font-weight:700}.key i{font-style:normal;color:var(--line)}
/* ---- transport ---- */
.transport{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--raised);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.t-in{max-width:1380px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:52px}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--brass);color:#1a1205;display:grid;place-items:center;box-shadow:0 4px 14px var(--brass-glow);flex:none}
.play svg{width:22px;height:22px}
.play.on{background:var(--red);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--red) 45%,transparent)}
.pos{display:flex;flex-direction:column;line-height:1.1;min-width:116px}
.pos b{font-family:var(--f-mono);font-size:17px}
.pos-btn{font-family:var(--f-mono);font-size:17px;font-weight:700;border:1px solid transparent;background:none;padding:1px 4px;margin-left:-5px;border-radius:6px;text-align:left;color:var(--ink);cursor:text}
.pos-btn:hover{border-color:var(--line);background:var(--sunk)}
.pos-in{width:92px;font-size:16px;border:1.5px solid var(--brass);border-radius:6px;padding:2px 6px;background:var(--raised);color:var(--ink)}
.stage-ctrl .ico{width:44px;height:44px;font-size:13px;letter-spacing:-2px}
.pos span{font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.t-opts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.ico{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;color:var(--ink2);flex:none}
.ico:hover{border-color:var(--mut);color:var(--ink)}
.ico svg{width:18px;height:18px}

/* ---- sheets / dialogs ---- */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.48);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .15s}
@media (min-width:760px){.scrim{align-items:center;padding:24px}}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:920px;max-height:calc(100vh - env(safe-area-inset-top,0px) - 12px);overflow:auto;border-radius:18px 18px 0 0;box-shadow:var(--shadow-lg);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:rise .22s ease-out}
@media (min-width:760px){.sheet{border-radius:18px;padding:22px 24px}}
.sheet.sm{max-width:460px}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h2{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1;letter-spacing:.01em;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sheet-h .x{margin-left:auto}
.steps{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.step{min-width:0}
.preview{max-width:100%}
.step{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.step h3{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.step h3 .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-family:var(--f-mono)}
.step p{margin:0 0 8px;color:var(--mut);font-size:13px}
.wave{width:100%;height:120px;display:block;border-radius:var(--r-sm);background:var(--sunk);touch-action:none;cursor:ew-resize}
.wave-ov{width:100%;height:34px;display:block;border-radius:6px;background:var(--sunk);margin-top:6px;cursor:pointer}
.rowx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:8px 16px}
.sliders input{min-width:0;width:100%}
.sliders label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;font-weight:700}
.sliders output{font-family:var(--f-mono);font-size:12px;color:var(--mut);min-width:3ch;text-align:right}
.preview{display:flex;gap:6px;overflow-x:auto;background:var(--paper);border:1px solid var(--line2);border-radius:var(--r-sm);padding:6px}
.preview svg{flex:none}
.lbl-s{font-size:12px;font-weight:700;color:var(--mut)}
.preview .pv-bar{flex:none;position:relative;line-height:0;padding-top:10px;border-radius:4px}
.preview .pv-bar i{position:absolute;left:3px;top:0;font-style:normal;font-family:var(--f-mono);font-size:9px;color:var(--mut);line-height:1}
.preview .pv-bar.ch{background:color-mix(in srgb,var(--brass) 9%,transparent)}
.preview .pv-bar.ch i{color:var(--brass-ink);font-weight:700}
.pv-what{font-size:12px}.pv-add-k{color:var(--brass-ink)}.pv-del-k{color:var(--red)}
.counts b.up{color:var(--brass-ink)}.counts b.down{color:var(--red)}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.counts span{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border:1px solid var(--line2);border-radius:999px;padding:2px 8px;color:var(--ink2)}
.busy{display:flex;align-items:center;gap:14px;padding:30px 4px;font-weight:700}
.sticks{width:46px;height:46px}
.sticks line{stroke:var(--ink);stroke-width:4;stroke-linecap:round;transform-origin:23px 40px}
.sticks .l{animation:stick .5s ease-in-out infinite alternate}
.sticks .r{animation:stick .5s ease-in-out .25s infinite alternate}
@keyframes stick{from{transform:rotate(-22deg)}to{transform:rotate(8deg)}}
.foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px;flex-wrap:wrap}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tbar) + 20px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100vw - 32px))}
body.lib .toasts{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.toast{background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);pointer-events:auto;display:flex;gap:10px;align-items:center;animation:rise .2s ease-out}
.toast button{background:transparent;border:1px solid color-mix(in srgb,var(--paper) 40%,transparent);color:var(--paper);border-radius:6px;padding:3px 8px;font-weight:700}

/* ---- stage mode ---- */
.stage{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.stage-h{display:flex;align-items:center;gap:14px;padding-bottom:10px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.stage-h .nm{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4vw,44px);text-transform:uppercase;line-height:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-now{margin-left:auto;text-align:right;line-height:1.05}
.stage-now b{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.6vw,40px);text-transform:uppercase;color:var(--brass-ink)}
.stage-now span{font-family:var(--f-mono);font-size:13px;color:var(--mut)}
.stage-body{flex:1;overflow:auto;padding:16px 0 120px;scroll-behavior:smooth}
.stage-body .bar svg{width:calc(var(--sz,1.6) * 168px);height:auto}
.stage-ctrl{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.stage-ctrl .play{width:64px;height:64px}

/* ---- mixer ---- */
.mixer{position:fixed;z-index:36;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tbar) + 12px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 32px));
  max-height:calc(100vh - var(--tbar) - 100px);overflow:auto;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:12px 14px;animation:rise .18s ease-out}
.mx-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.mx-h h3{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.mx-h span{font-size:12px}.mx-h button{margin-left:auto}
.xf{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12px;font-weight:700;color:var(--ink2);background:var(--sunk);border:1px solid var(--line2);border-radius:var(--r-sm);padding:10px}
.xf input{width:100%}
.xf-hint{font-size:12px;margin:4px 0 10px;text-align:center}
.linkish{border:0;background:none;padding:0;color:var(--brass-ink);font-weight:700;text-decoration:underline;font-size:12px}
.strip{display:grid;grid-template-columns:minmax(0,1fr) 120px 46px auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line2)}
.strip.off{opacity:.55}
.st-name{min-width:0;line-height:1.15}.st-name b{display:block;font-size:14px}
.st-name span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip input{width:100%}.strip output{font-size:12px;color:var(--mut);text-align:right}
.mx-sec{border-top:1px solid var(--line2);padding-top:10px;margin-top:4px;display:grid;gap:8px}
.mx-sec p{margin:0;font-size:12px}
.off-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.off-row .lbl{font-size:12px;font-weight:700;color:var(--ink2);margin-right:4px;flex-basis:100%}
.off-row input{width:84px;border:1px solid var(--line);background:var(--raised);border-radius:var(--r-sm);padding:5px 7px;color:var(--ink)}
.step.choice{display:block;width:100%;text-align:left;cursor:pointer}
.step.choice:hover{border-color:var(--brass)}
body.mixing .kit-dock{display:none!important}
@media (min-width:900px){body.mixing .toasts{left:max(16px,env(safe-area-inset-left,0px));transform:none;align-items:flex-start;width:min(520px,calc(100vw - 480px))}}
@media (max-width:640px){.mixer{left:0;right:0;width:auto;border-radius:16px 16px 0 0;bottom:calc(var(--tbar) + env(safe-area-inset-bottom,0px));max-height:70vh}
  .strip{grid-template-columns:minmax(0,1fr) 96px 40px auto}}
/* ---- repeat phrase ---- */
.phrase{margin-top:12px;border:1.5px solid var(--brass);border-radius:var(--r-sm);background:color-mix(in srgb,var(--brass) 6%,var(--raised));padding:10px;display:grid;gap:8px}
.ph-h{display:flex;align-items:center}.ph-h b{font-family:var(--f-display);font-size:20px;font-weight:800;text-transform:uppercase;line-height:1}.ph-h button{margin-left:auto}
.ph-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ph-row .lbl{font-size:12px;color:var(--mut);font-weight:700;min-width:52px}
.ph-val{min-width:58px;text-align:center;font-weight:700}
.ph-note{font-size:12px;margin:0}
.ph-row .field input[type=number]{width:70px}
.ph-sum{margin:0;font-size:13px;font-weight:700;color:var(--ink)}
.bar.inrng{background:color-mix(in srgb,var(--focus) 10%,transparent);border-color:color-mix(in srgb,var(--focus) 55%,transparent)}
.selbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px;font-size:13px}
.selbar .lbl{font-size:12px;color:var(--mut);font-weight:700}
.selbar b{min-width:52px;text-align:center}
.selbar .mut{font-size:12px}
.selbar.multi{background:color-mix(in srgb,var(--focus) 8%,transparent);border-radius:var(--r-sm);padding:4px 6px;margin-left:-6px;margin-right:-6px}
.clipnote{font-size:12px;margin:-4px 0 8px}
.bar.ph-src{outline:2.5px solid var(--brass);outline-offset:1px;background:color-mix(in srgb,var(--brass) 12%,transparent)}
.bar.ph-dst{outline:2px dashed var(--red);outline-offset:1px;background:color-mix(in srgb,var(--red) 7%,transparent)}
/* ---- export options ---- */
.ex-g{display:grid;gap:6px;margin:12px 0}
.ex-g .lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ex-opt{align-items:flex-start;color:var(--ink);font-weight:400;padding:6px 0}
.ex-opt b{display:block;font-size:14px}.ex-opt small{display:block;color:var(--mut);font-size:12px}
.ex-opt input{margin-top:2px}
.ex-list{display:grid;gap:4px;max-height:200px;overflow:auto;background:var(--raised);border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 10px}
.ex-list .field{color:var(--ink);font-weight:400}
.ex-note{font-size:12px;margin:0}
/* ---- kit dock (narrow screens): compact kit above the transport ---- */
.kit-dock{display:none}
.show-narrow{display:none!important}
/* ---- responsive ---- */
@media (max-width:1040px){
  .song{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:calc(var(--tbar) + env(safe-area-inset-bottom,0px));top:auto;max-height:62vh;z-index:34;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.12);
    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));transform:translateY(110%);transition:transform .22s ease;border-radius:16px 16px 0 0}
  body.editing .side{transform:none}
  .kit-panel{display:none}
  .show-narrow{display:inline-flex!important}
  body.kitdock:not(.lib):not(.editing) .kit-dock{display:block;position:fixed;left:0;right:0;z-index:33;bottom:calc(var(--tbar) + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb,var(--raised) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:4px max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px))}
  .kit-dock .kit{height:132px;width:auto;max-width:100%}
  body.kitdock:not(.lib) {padding-bottom:calc(var(--tbar) + 170px)}
  .hero{grid-template-columns:minmax(0,1fr);padding-top:18px}
  .head-wrap{order:-1}
}
@media (max-width:640px){
  :root{--tbar:122px}
  .t-opts{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .t-opts::-webkit-scrollbar{display:none}
  .t-opts>*{flex:none}
  .top{padding-block:6px}
  .mark{font-size:19px}
  .tools .btn{padding:6px 10px}
  .pos{min-width:0;flex:1}
  .t-in{gap:6px}
  .t-in>.ico{width:34px;height:34px}.t-in>.ico svg{width:16px;height:16px}
  .t-in>.play{width:48px;height:48px}
  .pos-btn,.pos b{font-size:15px}.pos-in{width:62px;font-size:15px}
  .pos span{max-width:100px}
  .song-title{font-size:21px}
  .grid{grid-template-columns:60px repeat(var(--cols,16),minmax(0,1fr))}
  .grid .rl{font-size:10px;padding:0}
  .grid .c{height:20px}
  .hide-sm{display:none!important}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head><body>

<header class="top">
  <div class="top-in">
    <button class="mark" id="home" aria-label="Song library">Drum Chart Editor <span class="v">2.0</span></button>
    <div class="crumb" id="crumb" hidden>
      <input class="song-title" id="title" aria-label="Song name" spellcheck="false">
    </div>
    <div class="tools" id="songTools" hidden>
      <label class="field hide-sm">BPM <input type="number" id="bpm" min="30" max="300" step="1"></label>
      <div class="seg" role="group" aria-label="Notation" id="noteSeg">
        <button data-note="lines">Lines</button><button data-note="staff">Staff</button><button data-note="both">Both</button>
      </div>
      <button class="btn ghost" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="btn ghost" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <div class="menu">
        <button class="btn" id="exportBtn" aria-haspopup="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Export</button>
        <div class="menu-pop" id="exportMenu" hidden>
          <button data-ex="pdf">PDF chart<small>Follows the Lines / Staff / Both setting</small></button>
          <button data-ex="mid">MIDI file<small>General MIDI drums, channel 10</small></button>
          <button data-ex="txt">Text tab<small>Plain text, one line per drum</small></button>
          <hr>
          <button data-ex="pdfall">PDF of every song</button>
          <button data-ex="proj">Project file…<small>Charts, recordings and settings: choose what to include</small></button>
        </div>
      </div>
      <button class="btn pri" id="stageBtn" title="Stage mode (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>Stage</button>
    </div>
    <div class="tools" id="libTools" style="margin-left:auto">
      <button class="btn ghost" id="helpBtn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
    </div>
  </div>
</header>

<main>
  <!-- LIBRARY -->
  <section id="lib">
    <div class="hero">
      <div>
        <h1>Drop a drum track.<br><em>Get the chart.</em></h1>
        <p>Drop a drums-only recording (.m4a, .wav, .mp3) or MIDI files on the drum. Check the tempo by ear, and your chart is ready to edit, play along with and print.</p>
        <div class="acts">
          <button class="btn pri" id="pickAudio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Choose a recording</button>
          <button class="btn" id="pickMidi">Import MIDI</button>
          <button class="btn" id="newBlank">Blank song</button>
          <button class="btn ghost" id="pickProj">Open project file</button>
        </div>
      </div>
      <div class="head-wrap">
        <button class="drumhead" id="drop" aria-label="Drop a recording or MIDI file here, or click to choose one">
          <svg viewBox="-200 -200 400 400" aria-hidden="true">
            <circle class="skin" r="172"/>
            <circle class="ring" r="80"/>
            <circle class="rim" r="176"/>
            <circle class="rim2" r="160"/>
            <g id="lugs"></g>
            <text class="txt1" y="-6" text-anchor="middle">Drop it here</text>
            <text class="txt2" y="22" text-anchor="middle">recording or MIDI · or tap to choose</text>
          </svg>
        </button>
      </div>
    </div>
    <div class="lib-head">
      <h2>Your songs</h2>
      <span class="mut" id="libCount"></span>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- SONG -->
  <section id="song" class="song" hidden>
    <div class="chart-wrap" id="chart" aria-label="Drum chart"></div>
    <aside class="side" id="side">
      <div class="panel kit-panel">
        <h3>Kit <span class="mut" style="text-transform:none;letter-spacing:0;font-weight:400">lights up as it plays · tap to hear</span></h3>
        <div id="kitHost" class="kit-host"></div>
      </div>
      <div class="panel" id="editor"></div>
      <div class="panel">
        <details class="more-tools" id="songMore">
          <summary>Song tools</summary>
          <div class="ed-row"><span class="lbl">Shift every hit</span>
            <button class="btn sm" data-shift="-1">◀ Earlier</button><button class="btn sm" data-shift="1">Later ▶</button>
            <select id="shiftBy" aria-label="Shift amount"><option value="1">1 step</option><option value="4">1 beat</option><option value="16">1 bar</option></select>
          </div>
          <div class="ed-row"><button class="btn sm" id="firstToOne">First hit → beat 1</button></div>
          <div class="ed-row">
            <label class="field"><input type="checkbox" id="optComp"> Group repeats (×n)</label>
            <label class="field"><input type="checkbox" id="optOwn"> Repeats on their own line</label>
          </div>
          <div class="ed-row"><label class="field"><input type="checkbox" id="optFollow" checked> Follow playback</label>
            <label class="field"><input type="checkbox" id="optMuteFill" checked> Silence fills in playback</label></div>
        </details>
      </div>
    </aside>
  </section>
</main>

<!-- TRANSPORT -->
<div class="transport" id="transport" hidden>
  <div class="t-in">
    <button class="ico" id="tRew" title="Back to start (Home)" aria-label="Back to start"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="ico" id="tBarPrev" title="Previous bar (Shift+←)" aria-label="Previous bar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 6v12L4 12zM20 6v12l-7.5-6z"/></svg></button>
    <button class="ico" id="tPrev" title="Step back (←)" aria-label="Step back"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 6v12L7 12z"/></svg></button>

<script>
"use strict";
/* =====================================================================
   Drum Chart Editor 2.0
   Songs are 4/4 on a 16-step grid. Each step is a bitmask of drums hit.
   ===================================================================== */

/* ---------- The kit ----------
   bit: step bitmask · sym: text-tab letter · glyph: line-view mark (X crash, x cymbal, H open hat, F filled head)
   staff: half-spaces up from the bottom staff line · head: staff note head · foot: stems down
   gm: General MIDI note for export · kit: piece in the kit drawing */
const KIT = [
  { id: "crash",  name: "Crash",     bit: 1,    sym: "X", glyph: "X", staff: 10, head: "x",  foot: false, gm: 49, cym: true },
  { id: "crash2", name: "Crash 2",   bit: 32,   sym: "X", glyph: "X", staff: 11, head: "x",  foot: false, gm: 57, cym: true },
  { id: "hat",    name: "Hi-hat",    bit: 2,    sym: "x", glyph: "x", staff: 9,  head: "x",  foot: false, gm: 42, cym: true },
  { id: "ohat",   name: "Open hat",  bit: 128,  sym: "o", glyph: "H", staff: 9,  head: "xo", foot: false, gm: 46, cym: true },
  { id: "ride",   name: "Ride",      bit: 64,   sym: "r", glyph: "x", staff: 8,  head: "x",  foot: false, gm: 51, cym: true },
  { id: "htom",   name: "High tom",  bit: 256,  sym: "o", glyph: "F", staff: 7,  head: "n",  foot: false, gm: 48 },
  { id: "snare",  name: "Snare",     bit: 8,    sym: "O", glyph: "F", staff: 5,  head: "n",  foot: false, gm: 38 },
  { id: "ltom",   name: "Low tom",   bit: 512,  sym: "o", glyph: "F", staff: 3,  head: "n",  foot: false, gm: 43 },
  { id: "kick",   name: "Kick",      bit: 16,   sym: "O", glyph: "F", staff: 1,  head: "n",  foot: true,  gm: 36 },
  { id: "pedal",  name: "Hat pedal", bit: 1024, sym: "p", glyph: "x", staff: -1, head: "x",  foot: true,  gm: 44, cym: true },
];
const BIT = Object.fromEntries(KIT.map(k => [k.id, k.bit]));
const SECTION_NAMES = ["Intro", "Verse", "Pre-chorus", "Chorus", "Bridge", "Solo", "Break", "Outro"];

/* ---------- Small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const blankBars = n => Array.from({ length: n }, () => Array(16).fill(0));
const fileBase = s => (s || "drum-chart").replace(/[^\w .()'-]+/g, "_").trim() || "drum-chart";
const stepSec = bpm => 60 / bpm / 4;
function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- App state ---------- */
const App = {
  songs: [],            // all songs
  cur: null,            // current song object
  view: "lib",          // "lib" | "song"
  note: "lines",        // notation: "lines" | "staff" | "both"
  clip: null,           // copied bar
  editAll: true,        // edit every repeat of a bar together
  follow: true,         // chart follows playback
  muteFills: true,
  kitDock: true,
  mix: { xf: .5, vol: { chart: 1, drums: 1, full: 1 }, mute: { chart: false, drums: false, full: false } },         // phones: show the compact kit above the transport
  hist: {},             // songId -> {undo:[], redo:[]}
};

/* A song, normalised so every field exists and has the right shape. Used for new songs and anything imported. */
function normSong(o) {
  const bars = Array.isArray(o.bars) && o.bars.length ? o.bars : blankBars(8);
  const clean = bars.map(b => {
    // bars are normally 16 steps (4/4); a split bar can be anything from 1 to 32 steps
    const L = Array.isArray(b) && b.length ? clamp(b.length, 1, 32) : 16, r = Array(L).fill(0);
    if (Array.isArray(b)) for (let i = 0; i < L; i++) { let m = (+b[i] || 0) & 0xFFFF; if (m & 4) m = (m & ~4) | 256; r[i] = m & 2043; }
    return r;
  });
  const n = clean.length;
  const fill = {}, brk = {}, solo = {}, flow = {}, notes = {};
  // notes: free text (notes, lyrics) shown under a section's title, by the section's first bar
  if (o.notes && typeof o.notes === "object") for (const k in o.notes) { const i = +k, t = typeof o.notes[k] === "string" ? o.notes[k].replace(/\r\n?/g, "\n").replace(/\s+$/, "").slice(0, 2000) : ""; if (Number.isInteger(i) && i >= 0 && i < n && t.trim()) notes[i] = t; }
  // solo: bars that never join a repeat group · flow: sections (by first bar) whose repeats are written out
  for (const [src, dst] of [[o.solo, solo], [o.flow, flow]]) if (src && typeof src === "object") for (const k in src) { const i = +k; if (i >= 0 && i < n && src[k]) dst[i] = 1; }
  if (o.fill && typeof o.fill === "object") for (const k in o.fill) { const i = +k, v = (+o.fill[k]) & 255; if (i >= 0 && i < n && v) fill[i] = v; }
  if (o.brk && typeof o.brk === "object") for (const k in o.brk) { const i = +k, v = +o.brk[k]; if (i >= 0 && i < n && (v === 1 || v === -1)) brk[i] = v; }
  const secs = (Array.isArray(o.secs) ? o.secs : [])
    .filter(x => x && Number.isInteger(+x.at) && +x.at >= 0 && +x.at < n && String(x.name || "").trim())
    .map(x => ({ at: +x.at, name: String(x.name).trim().slice(0, 40) }))
    .filter((x, i, a) => a.findIndex(y => y.at === x.at) === i)
    .sort((a, b) => a.at - b.at);
  const track = t => t && typeof t === "object" && isFinite(t.offset) && +t.bpm > 0
    ? { name: String(t.name || "recording"), offset: +t.offset, bpm: +t.bpm, duration: +t.duration || 0 } : null;
  const rec = track(o.rec), full = track(o.full);
  return {
    id: typeof o.id === "string" && o.id ? o.id : uid(),
    name: String(o.name || "Untitled").trim().slice(0, 80) || "Untitled",
    bpm: clamp(Math.round((+o.bpm || 120) * 10) / 10, 30, 300),
    bars: clean, secs, fill, brk, solo, flow, notes,
    comp: o.comp !== false, own: o.own !== false,
    sel: clamp(+o.sel || 0, 0, n - 1),
    rec, full, created: +o.created || Date.now(), updated: +o.updated || Date.now(),
  };
}

/* ---------- Storage: songs in localStorage, recordings in IndexedDB (both best-effort) ---------- */
const STORE_KEY = "dce2";
let saveWarned = false;
const saveNow = () => {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ v: 2, songs: App.songs.map(s => ({ ...s })), cur: App.cur && App.cur.id, note: App.note, editAll: App.editAll, follow: App.follow, muteFills: App.muteFills, kitDock: App.kitDock, mix: App.mix }));
  } catch (e) {
    if (!saveWarned) { saveWarned = true; toast("Couldn't save in this browser. Use Export → Project file to keep your work."); }
  }
};
const save = debounce(saveNow, 250);
function loadStore() {
  try { const o = JSON.parse(localStorage.getItem(STORE_KEY)); if (o && Array.isArray(o.songs)) return o; } catch (e) { }
  return null;
}
const RecDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise(res => {
      try {
        const r = indexedDB.open("dce2-recordings", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("rec");
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async op(mode, fn) {
    const db = await this.open(); if (!db) return null;
    return new Promise(res => {
      try { const tx = db.transaction("rec", mode), st = tx.objectStore("rec"), q = fn(st); tx.oncomplete = () => res(q ? q.result : true); tx.onerror = () => res(null); }
      catch (e) { res(null); }
    });
  },
  put(id, blob) { return this.op("readwrite", st => st.put(blob, id)); },
  get(id) { return this.op("readonly", st => st.get(id)); },
  del(id) { return this.op("readwrite", st => st.delete(id)); },
};

/* ---------- Undo / redo ---------- */
function histOf(s) { return App.hist[s.id] || (App.hist[s.id] = { undo: [], redo: [] }); }
const snap = s => JSON.stringify({ bars: s.bars, secs: s.secs, fill: s.fill, brk: s.brk, solo: s.solo, flow: s.flow, notes: s.notes, bpm: s.bpm, name: s.name, comp: s.comp, own: s.own, rec: s.rec, full: s.full, sel: s.sel });
/* Every edit goes through change(): it records an undo point, applies the edit, saves and redraws. */
function change(fn, opts = {}) {
  const s = App.cur; if (!s) return;
  const h = histOf(s); h.undo.push(snap(s)); if (h.undo.length > 150) h.undo.shift(); h.redo = [];
  fn(s);
  s.sel = clamp(s.sel, 0, s.bars.length - 1);
  s.updated = Date.now(); save();
  if (!opts.quiet) refreshSong();
  updateUndo();
}
function restore(s, json) { Object.assign(s, JSON.parse(json)); s.updated = Date.now(); }
function undo() { const s = App.cur; if (!s) return; const h = histOf(s); if (!h.undo.length) return toast("Nothing to undo."); h.redo.push(snap(s)); restore(s, h.undo.pop()); save(); refreshSong(); updateUndo(); }
function redo() { const s = App.cur; if (!s) return; const h = histOf(s); if (!h.redo.length) return; h.undo.push(snap(s)); restore(s, h.redo.pop()); save(); refreshSong(); updateUndo(); }
function updateUndo() { const s = App.cur; if (!s) return; const h = histOf(s); $("#undo").disabled = !h.undo.length; $("#redo").disabled = !h.redo.length; }

/* ---------- Song structure: sections and repeats ---------- */
/* Sections: list of {a, b, label} covering every bar. Repeated names get numbers (Chorus 1, Chorus 2). */
function sections(s) {
  const n = s.bars.length, list = [{ at: 0, name: "" }];
  s.secs.filter(x => x.at < n).forEach(x => x.at ? list.push(x) : list[0] = x);
  const total = {}; list.forEach(x => total[x.name] = (total[x.name] || 0) + 1);
  const seen = {};
  return list.map((x, i) => {
    seen[x.name] = (seen[x.name] || 0) + 1;
    const label = x.name ? (total[x.name] > 1 ? `${x.name} ${seen[x.name]}` : x.name) : (list.length > 1 ? "Top" : "Song");
    return { a: x.at, b: i + 1 < list.length ? list[i + 1].at : n, label, name: x.name };
  });
}
function sectionAt(s, bar) { return sections(s).find(c => bar >= c.a && bar < c.b); }
/* Repeat groups inside a section: {s: start, L: length in bars, n: times}. Fills count as part of a bar's identity. */
function units(s, a, b) {
  // a bar marked "on its own" gets a key nothing else matches, so groups form around it
  const key = i => s.solo[i] ? "solo:" + i : s.bars[i].join() + "|" + (s.fill[i] || 0);
  const grouped = s.comp && !s.flow[a];   // this section's repeats can be written out instead
  const out = [];
  let i = a;
  while (i < b) {
    let L = 1, n = 1;
    if (grouped) for (let l = 1; l <= 4 && i + l <= b; l++) {
      let c = 1;
      while (i + (c + 1) * l <= b && Array.from({ length: l }, (_, j) => key(i + c * l + j) === key(i + j)).every(Boolean)) c++;
      if (c > 1 && c * l > L * n) { L = l; n = c; }
    }
    out.push({ s: i, L, n }); i += L * n;
  }
  return out;
}
function unitMap(s) { const m = {}; sections(s).forEach(c => units(s, c.a, c.b).forEach(u => { for (let k = 0; k < u.L * u.n; k++) m[u.s + k] = u; })); return m; }
/* Line break before unit u: explicit setting wins, otherwise repeats get their own line. */
function breakBefore(s, u, prev) { const o = s.brk[u.s]; if (o) return o === 1; return !!prev && s.own && (u.n > 1 || prev.n > 1); }
/* Rows the line view shows: drums used anywhere in the song (or hat, snare, kick for an empty song). */
function usedRows(s) {
  const used = KIT.map((k, i) => s.bars.some(b => b.some(m => m & k.bit)) ? i : -1).filter(i => i >= 0);
  return used.length ? used : [2, 6, 8];
}
/* The bar that repeats most — shown as the song's groove on library cards. */
function mainGroove(s) {
  const c = {}; let best = null, bn = 0;
  s.bars.forEach(b => { if (!b.some(Boolean)) return; const k = b.join(); c[k] = (c[k] || 0) + 1; if (c[k] > bn) { bn = c[k]; best = b; } });
  return best || s.bars[0];
}
function songLength(s) { return totalSteps(s) * stepSec(s.bpm); }

/* ---------- Timeline: bars can have different lengths ----------
   A "slot" is a step counted from the start of the song. barStarts(s)[i] is bar i's first slot; the last entry is the total. */
function barStarts(s) {
  const st = new Array(s.bars.length + 1); st[0] = 0;
  for (let i = 0; i < s.bars.length; i++) st[i + 1] = st[i] + s.bars[i].length;
  return st;
}
const totalSteps = s => { let n = 0; for (const b of s.bars) n += b.length; return n; };
/* Bar holding slot k (binary search over the starts) */
function barOfSlot(st, k) { let lo = 0, hi = st.length - 2; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (st[m] <= k) lo = m; else hi = m - 1; } return lo; }
const beatsIn = L => Math.ceil(L / 4);
/* Time signature for a bar of L sixteenths: 16 → 4/4, 8 → 2/4, 12 → 3/4, 6 → 3/8, 5 → 5/16 */
const timeSig = L => L % 4 === 0 ? `${L / 4}/4` : L % 2 === 0 ? `${L / 2}/8` : `${L}/16`;
/* ---------- Built-in songs (transcribed earlier; same encoding as v1) ---------- */
const LOW=[192,196,197,256,260,608,612,613,616,641,645,646,648,705,709,712,769,773,776,832,837,840,909,925,942,944];

    line: (a, b, c, d, w, o) => s += `<line x1="${f(a)}" y1="${f(b)}" x2="${f(c)}" y2="${f(d)}" stroke="var(--ink)" stroke-opacity="${o}" stroke-width="${w.toFixed(2)}" stroke-linecap="round"/>`,
    ell: (x, y, rx, ry) => s += `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${rx.toFixed(2)}" ry="${ry.toFixed(2)}" transform="rotate(-20 ${f(x)} ${f(y)})" fill="var(--ink)"/>`,
    circ: (x, y, r, w) => s += `<circle cx="${f(x)}" cy="${f(y)}" r="${r.toFixed(2)}" fill="none" stroke="var(--ink)" stroke-width="${(w * .8).toFixed(2)}"/>`,
    dot: (x, y, r) => s += `<circle cx="${f(x)}" cy="${f(y)}" r="${r.toFixed(2)}" fill="var(--ink)"/>`,
    bar: (x1, y, x2, t, dir) => s += `<rect x="${f(x1 - .4)}" y="${f(dir > 0 ? y : y - t)}" width="${f(x2 - x1 + .8)}" height="${t.toFixed(2)}" fill="var(--ink)"/>`,
    poly: (pts, w) => s += `<polyline points="${pts.map(p => p.map(f).join(",")).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="${w.toFixed(2)}" stroke-linejoin="round"/>`,
    fill: (x, y, w, h, t) => s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="var(--brass)" fill-opacity=".14" stroke="var(--brass)" stroke-dasharray="3 2"/><text x="${x + w / 2}" y="${y + h / 2 + 3.5}" font-size="10" font-weight="700" font-family="Atkinson Hyperlegible,sans-serif" text-anchor="middle" fill="var(--brass-ink)">${t}</text>`,

/* ---------- Kit drawing (top-down view) ---------- */

    ${pc("ltom", "Low tom", drum(240, 160, 32), 240, 164)}

    ${pc("kick", "Kick", `<rect class="glow" x="128" y="174" width="92" height="50" rx="12"/><g class="shape"><rect class="drum" x="136" y="182" width="76" height="34" rx="8"/></g>`, 174, 203)}
    ${pc("pedal", "Pedal", `<rect class="glow" x="28" y="176" width="40" height="44" rx="8"/><g class="shape"><rect class="drum" x="36" y="184" width="24" height="30" rx="5"/></g>`, 70, 199)}
  </svg>`;
}
/* Flash kit pieces for a step's bitmask (open hat lights the hi-hat). */

    if (!(m & k.bit)) return;
    const el = host.querySelector(`[data-kit="${k.id === "ohat" ? "hat" : k.id}"]`); if (!el || !el.getClientRects().length) return;

/* ---------- Recorded tracks: the drum track (used for the chart) and the full song (playback only) ----------

  for (const kind of ["drums", "full"]) {
    const meta = kind === "full" ? s.full : s.rec;
    if (!meta) { Tracks[kind] = null; continue; }
    if (Tracks[kind]) continue;

/* ---------- Event wiring ---------- */

    host.addEventListener("keydown", e => { const p = e.target.closest("[data-kit]"); if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); const bit = BIT[p.dataset.kit]; hit(bit); flashKit(bit); } });
  });
  $("#tKit").onclick = () => { App.kitDock = !App.kitDock; saveNow(); document.body.classList.toggle("kitdock", App.kitDock); $("#tKit").classList.toggle("on", App.kitDock); };
  // song tools

  $("#firstToOne").onclick = () => { const f = [].concat(...App.cur.bars).findIndex(Boolean); if (f < 0) toast("There are no hits yet."); else if (f === 0) toast("The first hit is already on beat 1."); else shiftHits(-f); };

  $("#optFollow").onchange = e => { App.follow = e.target.checked; save(); };

  posB.onclick = goOpen;

  goIn.onblur = goClose;

  });

/* ---------- Start-up ---------- */
function seedSongs() {
  const out = [];
  const add = (o, name) => out.push(normSong({ ...o, name: name || o.name, created: Date.now() - out.length * 60000, updated: Date.now() - out.length * 60000 }));
  try {
    const k = kipling(); const f = [].concat(...k.bars), c = f.map(m => m & 1);
    f.forEach((m, i) => { if (c[i] && [1, 2, 3, 4].some(j => i - j >= 0 && c[i - j])) k.bars[i >> 4][i & 15] &= ~1; });  // remove doubled crash hits
    add(demo(), "Dragonslayer"); PRE.forEach(p => add(preset(p))); add(k);
  } catch (e) { }
  return out;
}
function drawLugs() {

}

        mute: { chart: !!m.mute?.chart, drums: !!m.mute?.drums, full: !!m.mute?.full } };
    }
